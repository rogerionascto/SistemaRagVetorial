<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema RAG Educacional - Azure Foundry</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f1f5f9; color: #1e293b; display: flex; justify-content: center; padding: 40px 16px; }
    .container { width: 100%; max-width: 760px; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); padding: 32px; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; color: #0f172a; text-align: center; }
    p.sub { font-size: 0.9rem; color: #64748b; margin-bottom: 24px; text-align: center; }
    .input-group { display: flex; gap: 8px; margin-bottom: 20px; }
    input[type="text"] { flex: 1; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none; }
    input[type="text"]:focus { border-color: #2563eb; ring: 2px solid #93c5fd; }
    button { background-color: #2563eb; color: #ffffff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background-color: #1d4ed8; }
    button:disabled { background-color: #94a3b8; cursor: not-allowed; }
    
    .spinner { display: none; margin: 24px auto; width: 36px; height: 36px; border: 4px solid #e2e8f0; border-top: 4px solid #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    .card-resposta { display: none; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; margin-top: 20px; }
    .card-resposta h2 { font-size: 1.1rem; margin-bottom: 12px; color: #0f172a; }
    .card-resposta p { line-height: 1.6; font-size: 0.95rem; color: #334155; white-space: pre-wrap; }
    
    details { margin-top: 16px; border-top: 1px solid #e2e8f0; padding-top: 16px; }
    summary { font-size: 0.85rem; font-weight: 600; color: #2563eb; cursor: pointer; margin-bottom: 12px; }
    .chunk-item { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 6px; padding: 12px; margin-bottom: 8px; }
    .chunk-origem { font-size: 0.75rem; font-weight: 700; color: #475569; text-transform: uppercase; margin-bottom: 4px; }
    .chunk-conteudo { font-size: 0.85rem; color: #64748b; line-height: 1.4; }
  </style>
</head>
<body>

<div class="container">
  <h1>RAG Educacional com Azure Foundry</h1>
  <p class="sub">Busca vetorial integrada a Scraping, CSV e PDF</p>

  <form id="ragForm" onsubmit="enviarPergunta(event)">
    <div class="input-group">
      <input type="text" id="pergunta" placeholder="Digite sua dúvida educacional..." required autocomplete="off" />
      <button type="submit" id="btnEnviar">Pesquisar</button>
    </div>
  </form>

  <div id="loader" class="spinner"></div>

  <div id="resultado" class="card-resposta">
    <h2>Resposta Gerada</h2>
    <p id="textoResposta"></p>

    <details id="blocoAuditoria">
      <summary>Inspecionar Trechos Recuperados (Auditoria Vetorial)</summary>
      <div id="listaChunks"></div>
    </details>
  </div>
</div>

<script>
async function enviarPergunta(e) {
  e.preventDefault();
  const input = document.getElementById("pergunta");
  const btn = document.getElementById("btnEnviar");
  const loader = document.getElementById("loader");
  const resultado = document.getElementById("resultado");
  const textoResposta = document.getElementById("textoResposta");
  const listaChunks = document.getElementById("listaChunks");

  const pergunta = input.value.trim();
  if (!pergunta) return;

  btn.disabled = true;
  loader.style.display = "block";
  resultado.style.display = "none";
  listaChunks.innerHTML = "";

  try {
    const res = await fetch("/perguntar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pergunta: pergunta })
    });
    
    const data = await res.json();
    if (!res.ok) throw new Error(data.erro || "Falha na requisição");

    textoResposta.innerText = data.resposta;

    if (data.auditoria && data.auditoria.length > 0) {
      data.auditoria.forEach(item => {
        const div = document.createElement("div");
        div.className = "chunk-item";
        div.innerHTML = `<div class="chunk-origem">${item.fonte}</div><div class="chunk-conteudo">${item.conteudo}</div>`;
        listaChunks.appendChild(div);
      });
    }

    resultado.style.display = "block";
  } catch (err) {
    alert("Erro: " + err.message);
  } finally {
    loader.style.display = "none";
    btn.disabled = false;
  }
}
</script>

</body>
</html>
